name: Ledger entry

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  ledger:
    if: contains(github.event.issue.labels.*.name, 'ledger')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Restore paper state
        run: |
          git fetch origin data:refs/remotes/origin/data || true
          git worktree add ../data origin/data || mkdir -p ../data
          if [ -f ../data/state/state.json ]; then
            mkdir -p state
            cp ../data/state/state.json state/state.json
          fi
      - name: Run ledger tick
        env:
          OUT_DIR: ../out
          LEDGER_ISSUE_BODY: ${{ github.event.issue.body }}
          LEDGER_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: npm run tick
      - name: Publish snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ../out
          git init
          git checkout -b snapshot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:data
      - name: Comment and close issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          result=$(cat ../out/ledger-result.json)
          accepted=$(node -e "console.log(JSON.parse(process.argv[1]).accepted)" "$result")
          if [ "$accepted" = "true" ]; then
            summary=$(node -e "const r=JSON.parse(process.argv[1]); const p=JSON.parse(require('fs').readFileSync('../out/api/portfolio.json')); const warning=r.warnings?.length ? ' Warning: '+r.warnings.join('; ') : ''; console.log('Ledger entry accepted. Current cash: $'+p.manual.cash.toFixed(2)+', equity: $'+p.equity.toFixed(2)+'.'+warning)" "$result")
          else
            summary=$(node -e "console.log('Ledger entry rejected: '+(JSON.parse(process.argv[1]).error || 'invalid entry'))" "$result")
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$summary"
          gh issue close "$ISSUE_NUMBER"
